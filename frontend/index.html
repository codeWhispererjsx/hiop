<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%hospitality-it-ops-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HIOP connects hospitality network discovery, device intelligence, monitoring, asset management, and IT operations in one platform." />
    <meta property="og:title" content="HIOP — Hospitality IT Operations" />
    <meta property="og:description" content="Discover, understand, monitor, and manage hotel technology from one platform." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="Canvas" />
    <script src="/theme-init.js"></script>
    <style>
      #root { min-height: 100vh; }
      .startup-preload { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; color: CanvasText; background: radial-gradient(ellipse at 50% 35%, color-mix(in srgb, Highlight 12%, Canvas), Canvas 62%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; text-align: center; }
      .startup-preload-card { width: min(100%, 28rem); padding: 2.5rem 2rem; border: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); border-radius: 1.5rem; background: color-mix(in srgb, Canvas 92%, transparent); box-shadow: 0 24px 70px color-mix(in srgb, CanvasText 12%, transparent); }
      .startup-preload-mark { width: 3.25rem; height: 3.25rem; display: grid; place-items: center; margin: 0 auto 1.25rem; border-radius: 1rem; color: HighlightText; background: linear-gradient(145deg, Highlight, color-mix(in srgb, Highlight 72%, CanvasText)); box-shadow: 0 12px 28px color-mix(in srgb, Highlight 28%, transparent); font-size: 1.5rem; font-weight: 800; }
      .startup-preload h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.04em; }
      .startup-preload p { margin: .55rem 0 1.35rem; color: GrayText; font-size: .88rem; }
      .startup-preload-track { height: 4px; overflow: hidden; border-radius: 99px; background: color-mix(in srgb, CanvasText 10%, Canvas); }
      .startup-preload-track span { width: 35%; height: 100%; display: block; border-radius: inherit; background: linear-gradient(90deg, Highlight, color-mix(in srgb, Highlight 70%, CanvasText)); animation: preload-progress 1.4s ease-in-out infinite; }
      @keyframes preload-progress { to { transform: translateX(160%); } }
      @media (prefers-reduced-motion: reduce) { .startup-preload-track span { animation: none; } }
    </style>
    <title>HIOP — Hospitality IT Operations Portal</title>
  </head>
  <body>
    <div id="root">
      <main class="startup-preload" role="status" aria-live="polite">
        <section class="startup-preload-card">
          <div class="startup-preload-mark" aria-hidden="true">H</div>
          <h1>Starting HIOP</h1>
          <p>Preparing your hospitality operations workspace.</p>
          <div class="startup-preload-track" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
