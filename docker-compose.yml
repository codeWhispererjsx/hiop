name: hiop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiop}
      POSTGRES_USER: ${POSTGRES_USER:-hiop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - hiop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hiop]

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: &backend_environment
      APP_NAME: Hospitality IT Operations Platform
      APP_VERSION: ${APP_VERSION:-3.0.0-dev}
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded database credentials}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to at least 32 random characters}
      HIOP_AD_SECRET_KEY: ${HIOP_AD_SECRET_KEY:?Set a dedicated AD credential encryption key}
      HIOP_SNMP_SECRET_KEY: ${HIOP_SNMP_SECRET_KEY:?Set a dedicated SNMP credential encryption key}
      HIOP_DISCOVERY_CREDENTIAL_KEY: ${HIOP_DISCOVERY_CREDENTIAL_KEY:?Set a dedicated discovery credential encryption key}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: '["https://${HIOP_HOST:?Set HIOP_HOST to the production hostname}"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      SCHEDULER_ENABLED: "true"
      SCHEDULED_BACKUP_ENABLED: ${SCHEDULED_BACKUP_ENABLED:-true}
      SCHEDULED_BACKUP_HOUR_UTC: ${SCHEDULED_BACKUP_HOUR_UTC:-2}
      BACKUP_DIR: /var/lib/hiop/backups
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:-}
      RESTORE_DRILL_INTERVAL_DAYS: ${RESTORE_DRILL_INTERVAL_DAYS:-30}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-STARTTLS}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-HIOP Notifications}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      ENABLE_SUBDOMAIN_ROUTING: ${ENABLE_SUBDOMAIN_ROUTING:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [hiop]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend_environment
    cap_add:
      - NET_RAW
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [hiop]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - hiop_backup_data:/var/lib/hiop/backups

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${HIOP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [hiop]
    security_opt: [no-new-privileges:true]

networks:
  hiop:
    driver: bridge

volumes:
  hiop_postgres_data:
  hiop_backup_data:
